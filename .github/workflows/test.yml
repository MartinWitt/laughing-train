name: Code Quality Checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - 'releases/*'

jobs:
  run-spotless:
    uses: martinwitt/unreusable-workflows/.github/workflows/spotless-gradle.yaml@124564d2271257ff959e8e9703b959f44d306189 # master
    with:
      java-version: '21'
      distribution: 'oracle'
      working-dir: './'
  qodana-scan:
    permissions:
      security-events: write
    uses: martinwitt/unreusable-workflows/.github/workflows/qodana-scan.yaml@124564d2271257ff959e8e9703b959f44d306189 # master
  junit:
    uses: martinwitt/unreusable-workflows/.github/workflows/gradle-tests.yaml@124564d2271257ff959e8e9703b959f44d306189 # master
    with:
      java-version: '21'
      distribution: 'oracle'
      working-dir: './'
  build:
    uses: martinwitt/unreusable-workflows/.github/workflows/gradle-build.yaml@124564d2271257ff959e8e9703b959f44d306189 # master
    with:
      java-version: '21'
      distribution: 'oracle'
      working-dir: './'