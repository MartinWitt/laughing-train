name: Code Quality Checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - 'releases/*'

jobs:
  run-spotless:
    uses: martinwitt/unreusable-workflows/.github/workflows/spotless-gradle.yaml@838b6ffa6a9c4464dd13ca5f24541de1d35992be # master
    with:
      java-version: '21'
      distribution: 'oracle'
      working-dir: './'
  qodana-scan:
    permissions:
      security-events: write
    uses: martinwitt/unreusable-workflows/.github/workflows/qodana-scan.yaml@838b6ffa6a9c4464dd13ca5f24541de1d35992be # master
  junit:
    uses: martinwitt/unreusable-workflows/.github/workflows/gradle-tests.yaml@838b6ffa6a9c4464dd13ca5f24541de1d35992be # master
    with:
      java-version: '21'
      distribution: 'oracle'
      working-dir: './'
  build:
    uses: martinwitt/unreusable-workflows/.github/workflows/gradle-build.yaml@838b6ffa6a9c4464dd13ca5f24541de1d35992be # master
    with:
      java-version: '21'
      distribution: 'oracle'
      working-dir: './'