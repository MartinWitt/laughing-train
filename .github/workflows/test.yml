name: Code Quality Checks
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - master
      - 'releases/*'

jobs:
  run-spotless:
    uses: martinwitt/unreusable-workflows/.github/workflows/spotless-gradle.yaml@0936eb40681d648c8d3dba120123e95da2ef61d1 # master
    with:
      java-version: '21'
      distribution: 'oracle'
      working-dir: './'
  qodana-scan:
    permissions:
      security-events: write
    uses: martinwitt/unreusable-workflows/.github/workflows/qodana-scan.yaml@0936eb40681d648c8d3dba120123e95da2ef61d1 # master
  junit:
    uses: martinwitt/unreusable-workflows/.github/workflows/gradle-tests.yaml@0936eb40681d648c8d3dba120123e95da2ef61d1 # master
    with:
      java-version: '21'
      distribution: 'oracle'
      working-dir: './'
  build:
    uses: martinwitt/unreusable-workflows/.github/workflows/gradle-build.yaml@0936eb40681d648c8d3dba120123e95da2ef61d1 # master
    with:
      java-version: '21'
      distribution: 'oracle'
      working-dir: './'